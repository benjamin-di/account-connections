name: PyPI
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    if: github.ref_type == 'tag' && (github.event_name == 'workflow_dispatch' || vars.PYPI_PUBLISH == 'true')
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.16"
      - name: Upload validated distributions
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
