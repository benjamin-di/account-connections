[project]
name = "account-connections"
version = "0.1.1"
description = "Explicit account sharing and selection for authenticated applications"
readme = "README.md"
license = "MIT"
authors = [{ name = "benjamin-di" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/benjamin-di/account-connections"
Issues = "https://github.com/benjamin-di/account-connections/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "mypy>=1.18"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
